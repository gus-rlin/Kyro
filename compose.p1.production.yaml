name: kyro-p1-production

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgres/tls/server.crt
      - -c
      - ssl_key_file=/run/postgres/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${KYRO_P1_DATABASE:?Set KYRO_P1_DATABASE}
      POSTGRES_USER: ${KYRO_DATABASE_ADMIN_USER:?Set KYRO_DATABASE_ADMIN_USER in deployment configuration}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets:
      - postgres_admin_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ${KYRO_POSTGRES_TLS_DIRECTORY:?Set KYRO_POSTGRES_TLS_DIRECTORY to the provisioned certificate directory}
        target: /run/postgres/tls
        read_only: true
      - type: bind
        source: ./config/postgres/pg_hba.production.conf
        target: /etc/postgresql/pg_hba.conf
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    image: ${KYRO_P1_RUNTIME_IMAGE:?Set KYRO_P1_RUNTIME_IMAGE to an immutable runtime image digest}
    profiles: [migration]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        KYRO_DATABASE_ADMIN_URL="$$(cat /run/secrets/admin_database_url)"
        test -n "$$KYRO_DATABASE_ADMIN_URL"
        export KYRO_DATABASE_ADMIN_URL
        exec /usr/local/bin/kyro-migrate
    secrets:
      - postgres_ca
      - admin_database_url
    restart: "no"

  api:
    image: ${KYRO_P1_RUNTIME_IMAGE:?Set KYRO_P1_RUNTIME_IMAGE to an immutable runtime image digest}
    profiles: [runtime]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        KYRO_DATABASE_URL="$$(cat /run/secrets/api_database_url)"
        test -n "$$KYRO_DATABASE_URL"
        export KYRO_DATABASE_URL
        if [ -s /run/secrets/oidc_client_secret ]; then
          KYRO_OIDC_CLIENT_SECRET="$$(cat /run/secrets/oidc_client_secret)"
          export KYRO_OIDC_CLIENT_SECRET
        fi
        exec /usr/local/bin/kyro-api
    environment:
      KYRO_ENV: production
      KYRO_BIND: 0.0.0.0:8080
      KYRO_MAX_CONNECTIONS: ${KYRO_MAX_CONNECTIONS:?Set KYRO_MAX_CONNECTIONS}
      KYRO_WORKER_POLL_MS: ${KYRO_WORKER_POLL_MS:?Set KYRO_WORKER_POLL_MS}
      KYRO_LEASE_SECONDS: ${KYRO_LEASE_SECONDS:?Set KYRO_LEASE_SECONDS}
      KYRO_MAX_BODY_BYTES: ${KYRO_MAX_BODY_BYTES:?Set KYRO_MAX_BODY_BYTES}
      KYRO_AUTH_UI_ORIGIN: ${KYRO_AUTH_UI_ORIGIN:?Set KYRO_AUTH_UI_ORIGIN}
      KYRO_AUTH_MAX_ACTIVE_SESSIONS: ${KYRO_AUTH_MAX_ACTIVE_SESSIONS:?Set KYRO_AUTH_MAX_ACTIVE_SESSIONS}
      KYRO_OIDC_ISSUER: ${KYRO_OIDC_ISSUER:?Set KYRO_OIDC_ISSUER}
      KYRO_OIDC_AUTHORIZATION_ENDPOINT: ${KYRO_OIDC_AUTHORIZATION_ENDPOINT:?Set KYRO_OIDC_AUTHORIZATION_ENDPOINT}
      KYRO_OIDC_TOKEN_ENDPOINT: ${KYRO_OIDC_TOKEN_ENDPOINT:?Set KYRO_OIDC_TOKEN_ENDPOINT}
      KYRO_OIDC_JWKS_URI: ${KYRO_OIDC_JWKS_URI:?Set KYRO_OIDC_JWKS_URI}
      KYRO_OIDC_REDIRECT_URI: ${KYRO_OIDC_REDIRECT_URI:?Set KYRO_OIDC_REDIRECT_URI}
      KYRO_OIDC_CLIENT_ID: ${KYRO_OIDC_CLIENT_ID:?Set KYRO_OIDC_CLIENT_ID}
      KYRO_OIDC_SYNTHETIC_PROVIDER: "false"
      KYRO_SYNTHETIC_PROVIDERS: "false"
      KYRO_MODEL_REGISTRY_PATH: /app/config/models.deployment.json
    volumes:
      - type: bind
        source: ${KYRO_MODEL_REGISTRY_FILE:?Set KYRO_MODEL_REGISTRY_FILE to the deployment model registry}
        target: /app/config/models.deployment.json
        read_only: true
    expose:
      - "8080"
    secrets:
      - postgres_ca
      - api_database_url
      - oidc_client_secret
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  worker:
    image: ${KYRO_P1_RUNTIME_IMAGE:?Set KYRO_P1_RUNTIME_IMAGE to an immutable runtime image digest}
    profiles: [runtime]
    command: []
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        KYRO_WORKER_DATABASE_URL="$$(cat /run/secrets/worker_database_url)"
        test -n "$$KYRO_WORKER_DATABASE_URL"
        export KYRO_WORKER_DATABASE_URL
        if [ -s /run/secrets/model_api_key ]; then
          KYRO_MODEL_API_KEY="$$(cat /run/secrets/model_api_key)"
          export KYRO_MODEL_API_KEY
        fi
        exec /usr/local/bin/kyro-worker
    environment:
      KYRO_ENV: production
      KYRO_BIND: 0.0.0.0:8080
      KYRO_MAX_CONNECTIONS: ${KYRO_MAX_CONNECTIONS:?Set KYRO_MAX_CONNECTIONS}
      KYRO_WORKER_POLL_MS: ${KYRO_WORKER_POLL_MS:?Set KYRO_WORKER_POLL_MS}
      KYRO_LEASE_SECONDS: ${KYRO_LEASE_SECONDS:?Set KYRO_LEASE_SECONDS}
      KYRO_MAX_BODY_BYTES: ${KYRO_MAX_BODY_BYTES:?Set KYRO_MAX_BODY_BYTES}
      KYRO_SYNTHETIC_PROVIDERS: "false"
      KYRO_MODEL_REGISTRY_PATH: /app/config/models.deployment.json
    volumes:
      - type: bind
        source: ${KYRO_MODEL_REGISTRY_FILE:?Set KYRO_MODEL_REGISTRY_FILE to the deployment model registry}
        target: /app/config/models.deployment.json
        read_only: true
    secrets:
      - postgres_ca
      - worker_database_url
      - model_api_key
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  postgres-data:

secrets:
  postgres_admin_password:
    file: ${KYRO_DATABASE_ADMIN_PASSWORD_FILE:?Set KYRO_DATABASE_ADMIN_PASSWORD_FILE to a secret-manager mounted file}
  admin_database_url:
    file: ${KYRO_DATABASE_ADMIN_URL_FILE:?Set KYRO_DATABASE_ADMIN_URL_FILE to a secret-manager mounted URL file}
  api_database_url:
    file: ${KYRO_API_DATABASE_URL_FILE:?Set KYRO_API_DATABASE_URL_FILE to a secret-manager mounted URL file}
  worker_database_url:
    file: ${KYRO_WORKER_DATABASE_URL_FILE:?Set KYRO_WORKER_DATABASE_URL_FILE to a secret-manager mounted URL file}
  postgres_ca:
    file: ${KYRO_POSTGRES_CA_FILE:?Set KYRO_POSTGRES_CA_FILE to the PostgreSQL CA certificate file}
  oidc_client_secret:
    file: ${KYRO_OIDC_CLIENT_SECRET_FILE:?Set KYRO_OIDC_CLIENT_SECRET_FILE to a secret file, empty only when the issuer does not use a client secret}
  model_api_key:
    file: ${KYRO_MODEL_API_KEY_FILE:?Set KYRO_MODEL_API_KEY_FILE to a secret file, empty only when enabled models do not require a key}
